
<div style="position: absolute; height: 20%; width: 20%; background-color: lightgray; top: 0px; right: 0px; overflow-y: auto;">
  <label>Tile tool
    <select [(ngModel)]="settings.tileMode" aria-label="Tile editing mode">
      <option value="rectangle">Rectangle</option><option value="brush">Brush / stamp</option>
      <option value="eraser">Eraser</option><option value="fill">Flood fill</option>
      <option value="pick">Pick tile</option><option value="capture">Capture manual tile pattern</option>
    </select>
  </label>
  <button *ngIf="settings.stamp" type="button" (click)="settings.stamp = undefined">Clear captured pattern</button>
  <p>Ctrl erases. Alt-click picks. Right-drag captures manual tiles on the selected layer.</p>
  <input [(ngModel)]="searchTerm" aria-label="Search tilesets">
  <p *ngFor="let tilesheet of getFilteredTilesets();" (click)="setSelectedTileset(tilesheet)" [ngClass]="getSelectedTileset() == tilesheet ? 'selected-tilesheet' : ''"
  style="margin:0">
    {{tilesheet}}
 </p>
</div>

<div style="position: absolute; height: 40%; width: 20%; background-color: lightgray; top: 20%; right: 0px; overflow-y: auto;">
    <ng-container *ngFor="let tile of tiles; let i = index">
        <!-- <img (click)="setSelectedTile(tile.name!)" ngClass="getSelectedTile() == tile.name!" [src]="tile.url" alt="Tile"> -->
        <img (click)="setSelectedTile(tile.name!)" [ngClass]="getSelectedTile() == tile.name! ? 'highlighted-tile' : ''" 
        [src]="tile.url" alt="Tile" class="tile">
      </ng-container>
</div>

<div style="position: absolute; height: 40%; width: 20%; background-color: lightgray; bottom: 0px; right: 0px; overflow-y: auto;">
  <!-- <p (click)="setSelectedLayer('Walls')" [ngClass]="getSelectedLayer() == 'Walls' ? 'selected-layer' : ''">Walls</p>
  <p (click)="setSelectedLayer('Floor')" [ngClass]="getSelectedLayer() == 'Floor' ? 'selected-layer' : ''">Floor</p> -->
  <p *ngFor="let layer of layers" (click)="setSelectedLayer(layer)" [ngClass]="getSelectedLayer() == layer ? 'selected-layer' : ''"
  style="margin:0">{{layer}}</p>
</div>
