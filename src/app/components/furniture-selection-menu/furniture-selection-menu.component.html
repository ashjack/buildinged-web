<div *ngIf="tileEditing || embedded; else objectFurniture" class="furniture-browser">
  <div class="groups" [hidden]="embedded" role="listbox" aria-label="Furniture groups"><button *ngFor="let group of furnitureGroups" role="option" [attr.aria-selected]="getSelectedFurnitureGroup() === group.label" [class.selected-layer]="getSelectedFurnitureGroup() === group.label" (click)="setSelectedFurnitureGroup(group.label)">{{group.label}}</button></div>
  <div class="entries-column">
    <div class="entries" aria-label="Furniture tile patterns">
      <div *ngFor="let furniture of furnitureTiles" class="entry-row">
        <button *ngFor="let entry of furniture.entries" class="entry" [class.selected-entry]="selectedFurniture === furniture && selectedFurnitureOrient === entry.orient" [attr.aria-label]="'Furniture pattern ' + entry.orient" (click)="setSelectedFurniture(furniture, entry.orient)" [style.width.px]="(entry.xSize + entry.ySize + 2) * 64 * zoom" [style.height.px]="256 * zoom + (entry.xSize + entry.ySize) * 32 * zoom">
          <img *ngFor="let tile of entry.tiles" [src]="tile.url" alt="" [style.width.px]="128 * zoom" [style.left.px]="(tile.x - tile.y + entry.ySize) * 64 * zoom" [style.bottom.px]="(entry.xSize + entry.ySize - tile.x - tile.y) * 32 * zoom">
        </button>
      </div>
    </div>
    <select *ngIf="!embedded" [ngModel]="zoom" (ngModelChange)="zoomChange.emit(+$event)" aria-label="Furniture zoom"><option *ngFor="let scale of zooms" [ngValue]="scale">{{scale * 100 | number:'1.0-0'}} %</option></select>
  </div>
</div>
<ng-template #objectFurniture>
<div style="position: absolute; height: 40%; width: 20%; background-color: lightgray; top: 0px; right: 0px; overflow-y: auto;">
  <p *ngFor="let furniture of furnitureGroups;" (click)="setSelectedFurnitureGroup(furniture.label)" [ngClass]="getSelectedFurnitureGroup() == furniture.label ? 'selected-layer' : ''"
  style="margin:0">
    {{furniture.label}}
 </p>
</div>

<div style="position: absolute; height: 60%; width: 20%; background-color: lightgray; top: 40%; right: 0px; overflow-y: auto;">
  <ng-container *ngFor="let furniture of furnitureTiles; let i = index">
    <div style="display: flex;">
    <ng-container *ngFor="let entry of furniture.entries">
    <div (click)="setSelectedFurniture(furniture, entry.orient)" [ngClass]="(selectedFurniture == furniture && selectedFurnitureOrient == entry.orient) ? 'selected-layer' : ''" style="display: flex; position: relative;" 
    [style.height]="100 + (entry.xSize > entry.ySize ? (entry.xSize * 30) : (entry.ySize * 30)) + 'px'"
    [style.width]="100 + (entry.xSize > entry.ySize ? (entry.xSize * 40) : (entry.ySize * 40)) + 'px'">
      
        <p>{{entry.orient}}</p>
        <div >
        <ng-container *ngFor="let fTile of entry.tiles">
          <img id="{{fTile.x + ', ' + fTile.y}}" class="furnitureTile" [src]="fTile.url" [style.left]="(fTile.x * 26) + (abs(fTile.y - entry.ySize) * 26) + 'px'" 
                [style.bottom]="(abs(fTile.x - entry.xSize) * 13) + (abs(fTile.y - entry.ySize) * 13) + 'px'">
        </ng-container>
        </div>
    </div>
  </ng-container>
</div>
  </ng-container>
</div>
